spring:
  # database configuration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payment_service_db?reWriteBatchedInserts=true}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:albin}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 25
      minimum-idle: 10
      connection-timeout: 3000
  # hibernate configuration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  # keycloak configuration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/project-aegis}

  # flyway configuration for db migration
  flyway:
    enabled: true
    locations: classpath:db/migration
    out-of-order: true
    baseline-on-migrate: true
    baseline-version: 0

# actuator configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,loggers,threaddump,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      simple:
        enabled: true

# keycloak configuration
keycloak:
  auth-server-url: ${KEYCLOAK_AUTH_SERVER_URL:http://localhost:8180}
  realm: ${KEYCLOAK_REALM:project-aegis}
  resource: ${KEYCLOAK_RESOURCE:payment-service}
  credentials:
    secret: ${KEYCLOAK_CREDENTIALS_SECRET:secret}

# server configuration
server:
  port: ${SERVER_PORT:8085}
  max-http-request-header-size: 16KB
  tomcat:
    max-http-form-post-size: 2MB
    max-swallow-size: 2MB
