spring:
#database configuration
    datasource:
      url: ${DB_URL:jdbc:postgresql://localhost:5432/user_service_db?reWriteBatchedInserts=true}
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 25
        minimum-idle: 10
        connection-timeout: 3000
#hibernate configuration
    jpa:
        hibernate:
            ddl-auto: validate
        show-sql: true
        properties:
            hibernate:
                format_sql: true
                jdbc:
                    batch_size: 50
                order_inserts: true
                order_updates: true
#keycloak configuration
    security:
        oauth2:
            resourceserver:
                jwt:
                    issuer-uri: ${KEYCLOAK_ISSUER_URI}

#flyway configuration for db migration
    flyway:
        enabled: true
        locations: classpath:db/migration
        baseline-on-migrate: true

#   actuator configuration
management:
    endpoints:
        web:
            exposure:
                include: health,info,metrics,env,loggers,threaddump,prometheus
            base-path: /actuator
    endpoint:
        health:
            show-details: always
    metrics:
        export:
            simple:
                enabled: true

# keycloak data (not used)
keycloak:
    auth-server-url: ${KEYCLOAK_AUTH_SERVER_URL}
    realm: ${KEYCLOAK_REALM}
    resource: ${KEYCLOAK_RESOURCE}
    credentials:
        secret: ${KEYCLOAK_CREDENTIALS_SECRET}

# server configuration
server:
    port: ${SERVER_PORT:8081}
    max-http-request-header-size: 16KB
    tomcat:
        max-http-form-post-size: 2MB
        max-swallow-size: 2MB

# internal webhook API key (shared secret with Keycloak SPI)
internal:
    api:
        key: ${INTERNAL_API_KEY}

# logging
logging:
    level:
        com.project_aegis.user_service.controller.internal: DEBUG