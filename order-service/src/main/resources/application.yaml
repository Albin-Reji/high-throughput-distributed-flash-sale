spring:
  application:
    name: order-service
  # enable virtual threads for better performance
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

# global request and header size limits
server:
  max-http-request-header-size: 16KB
  tomcat:
    max-http-form-post-size: 2MB
    max-swallow-size: 2MB

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        minimumNumberOfCalls: 20
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 3s
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 5
        automaticTransitionFromOpenToHalfOpenEnabled: true
        ignoreExceptions:
          - com.project_aegis.order_service.exception.ResourceNotFoundException
    instances:
      productService:
        baseConfig: default
      userService:
        baseConfig: default
      inventoryService:
        baseConfig: default
  timelimiter:
    configs:
      default:
        timeoutDuration: 3s
        cancelRunningFuture: true
    instances:
      productService:
        baseConfig: default
      userService:
        baseConfig: default
      inventoryService:
        baseConfig: default
